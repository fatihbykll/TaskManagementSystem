name: CI - Build and Test

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: TaskManagementTestDb
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Backend/TaskManagement.API/TaskManagement.API.csproj
      - run: dotnet restore Backend/TaskManagement.Tests/TaskManagement.Tests.csproj
      - run: dotnet build Backend/TaskManagement.API/TaskManagement.API.csproj --no-restore -c Release
      - run: dotnet build Backend/TaskManagement.Tests/TaskManagement.Tests.csproj --no-restore -c Release
      - run: dotnet test Backend/TaskManagement.Tests/TaskManagement.Tests.csproj -c Release
        env:
          ConnectionStrings__PostgresConnection: Host=localhost;Database=TaskManagementTestDb;Username=postgres;Password=postgres
          JwtSettings__SecretKey: ci-test-super-secret-key-for-actions
          JwtSettings__Issuer: TaskManagementAPI
          JwtSettings__Audience: TaskManagementClient
          JwtSettings__ExpirationMinutes: 60
          AdminEmail: admin@test.com
          DatabaseProvider: Postgres

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - run: npm run build -- --configuration production
        working-directory: Frontend
