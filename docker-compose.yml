services:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: taskapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal          # Dışarıya port expose edilmez — sadece backend erişir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ── .NET Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: taskapp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgresConnection: >
        Host=db;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
        Pooling=true;MaxPoolSize=20;
      JwtSettings__SecretKey:              ${JWT_SECRET}
      JwtSettings__Issuer:                 ${JWT_ISSUER}
      JwtSettings__Audience:               ${JWT_AUDIENCE}
      JwtSettings__AccessTokenExpirationMinutes: ${JWT_EXPIRY_MINUTES}
      AdminEmail:                          ${ADMIN_EMAIL}
      DatabaseProvider:                    Postgres
    volumes:
      - uploads_data:/app/wwwroot/uploads/attachments
      - logs_data:/app/logs
    networks:
      - internal          # DB'ye erişir
      - proxy             # Nginx'e erişilir
    # Dışarıya port expose ETMİYORUZ — yalnızca nginx üzerinden ulaşılır
  # ── Angular Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: taskapp-web
    restart: unless-stopped
    networks:
      - proxy
  # ── Nginx Reverse Proxy + SSL ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: taskapp-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - proxy
    environment:
      - DOMAIN=${DOMAIN}
  # ── Certbot (Let's Encrypt SSL) ───────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: taskapp-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Manuel çalıştırma: docker compose run certbot certonly --webroot ...
    profiles: ["certbot"]   # Sadece açıkça çağrıldığında çalışır
networks:
  internal:   # DB + Backend — internette görünmez
    internal: true
  proxy:      # Frontend + Backend + Nginx
volumes:
  postgres_data:    # DB verisi — container silinse bile kalır
  uploads_data:     # Yüklenen dosyalar
  logs_data:        # Uygulama logları
  certbot_certs:    # SSL sertifikaları
  certbot_www:      # ACME challenge
