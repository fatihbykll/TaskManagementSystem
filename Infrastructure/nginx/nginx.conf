# ── Rate Limiting Zonu ────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
# ── HTTP → HTTPS Yönlendirme ──────────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};
    # Let's Encrypt doğrulaması için
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
# ── HTTPS Ana Sunucu ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};
    # ── SSL Sertifikalar ───────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    # ── SSL Güvenlik Ayarları ──────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    # ── Security Headers ───────────────────────────────────────────────
    # HSTS: 1 yıl boyunca yalnızca HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Clickjacking koruması
    add_header X-Frame-Options "SAMEORIGIN" always;
    # MIME sniffing koruması
    add_header X-Content-Type-Options "nosniff" always;
    # XSS koruması (eski tarayıcılar)
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer bilgisini sınırla
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # İzin verilen kaynaklar
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: yalnızca kendi domain'den script/stil
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://${DOMAIN}; frame-ancestors 'none';" always;
    # ── Genel Ayarlar ──────────────────────────────────────────────────
    client_max_body_size 11m;   # 10MB upload + overhead
    # ── Angular Frontend ───────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
    # ── SignalR WebSocket ─────────────────────────────────────────────────
    location /hubs/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }
    # ── Auth endpoint'leri: daha sıkı rate limit ───────────────────────
    location /api/Auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # ── Backend API ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    # Gizli dosyalara erişimi engelle
    location ~ /\. {
        deny all;
        return 404;
    }
}
